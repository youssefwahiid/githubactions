name: jobs how it work

on:
  workflow_dispatch:

jobs:
  job_1:
    runs-on: ubuntu-latest
    steps:        # | allow you multi line string
      - uses: actions/checkout@v4    # pulls repo files in, including src/
     
      - run: |     
          npm install
        working-directory: ./src   
        shell: bash 
        # cmd , powershell , python
  job_2:
    runs-on: ubuntu-latest
    needs: job_1                       # will wait job_1 finish first
    steps:
      - run: echo "job 2  ${{ github.job }}"
      - run: echo "Triggered by ${{ github.actor }} on ${{ github.ref }}"

# ${{ matrix.os }} Current matrix value
# ${{ github.actor }} Who triggered the workflow
# ${{ github.ref }} Branch or tag that triggered it
# ${{ github.event_name }} What event triggered it (push, dispatch, etc.)
# ${{ secrets.MY_SECRET }} A secret you stored in repo settings
# ${{ env.MY_VAR }} An environment variable you defined
# ${{ job.status }} Current job status (success, failure)

