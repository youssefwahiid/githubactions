name: jobs how it work

on:
  workflow_dispatch:

jobs:
  job_1:
    runs-on: ubuntu-latest
    steps:        # | allow you multi line string
      - uses: actions/checkout@v4    # pulls repo files in, including src/
     
      - run: |     
          npm install
        working-directory: ./src   
        shell: bash 
        # cmd , powershell , python
  job_2:
    runs-on: ubuntu-latest
    needs: job_1                       # will wait job_1 finish first
    steps:
      - run: echo "job 2  ${{ github.job }}"
      - run: echo "Triggered by ${{ github.actor }} on ${{ github.ref }}"


